<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планер РК · 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2A3D; --navy2:#123650; --gold:#D79A2C; --paper:#EFF2F1;
    --line:#DDE3E1; --line2:#E4E8E7; --text:#232A2E; --muted:#5B6B72;
    --holiday:#F2C6C0; --transfer:#F5DCA8; --tentative:#F0DEB0; --weekend:#E7EBEC;
    --school:#1C8FA0; --school2:#8FC4D2;
    --vacation:#D79A2C; --trip:#1C8FA0; --meeting:#7C5CBF; --other:#78838E; --birthday:#C2577A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);}
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---- sidebar ---- */
  aside{width:272px;flex-shrink:0;background:var(--navy);color:#DCE7EA;display:flex;flex-direction:column;justify-content:space-between;}
  @media (max-width:900px){ aside{display:none;} }
  .side-top{padding:28px 24px 16px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .brand-badge{width:32px;height:32px;border-radius:6px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .brand-name{color:#fff;font-weight:600;font-size:18px;}
  .side-desc{font-size:12px;opacity:.6;line-height:1.5;margin:6px 0 24px;}
  .btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;background:var(--gold);color:#1a1200;cursor:pointer;margin-bottom:12px;}
  .btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2A4B60;border-radius:8px;padding:9px;font-weight:500;font-size:14px;background:transparent;color:#DCE7EA;cursor:pointer;margin-bottom:28px;}
  .side-section{margin-bottom:28px;}
  .side-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.5;font-weight:600;margin-bottom:10px;}
  .filter-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;font-size:14px;cursor:pointer;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:2px 0;opacity:.85;}
  .swatch{width:16px;height:16px;border-radius:4px;flex-shrink:0;}
  .swatch.border{border:1px solid #b9c2c6;}
  .bar{width:16px;height:6px;border-radius:3px;flex-shrink:0;}
  .side-bottom{padding:16px 24px;font-size:11px;opacity:.4;line-height:1.5;}

  /* ---- main ---- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:#fff;border-bottom:1px solid var(--line);}
  @media (max-width:640px){ .topbar{padding:14px 16px;} }
  .month-nav{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:32px;height:32px;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);}
  .icon-btn:hover{background:#f0f0f0;}
  .icon-btn:disabled{opacity:.25;cursor:default;}
  h1.mtitle{font-size:22px;margin:0;font-weight:600;color:var(--navy);}
  .mtitle .yr{font-size:16px;opacity:.5;font-weight:500;margin-left:6px;}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .view-toggle button{border:none;background:transparent;padding:7px 14px;font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .view-toggle button.active{background:var(--navy);color:#fff;}
  .month-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 32px;background:#F7F8F7;border-bottom:1px solid var(--line);}
  @media (max-width:640px){ .month-tabs{padding:10px 16px;} }
  .month-tab{flex-shrink:0;border:none;background:transparent;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--muted);cursor:pointer;}
  .month-tab.active{background:var(--navy);color:#fff;}

  .body-flex{flex:1;display:flex;min-height:0;}
  @media (max-width:1024px){ .body-flex{flex-direction:column;} }
  .grid-area{flex:1;min-width:0;padding:24px 28px;overflow-y:auto;}
  @media (max-width:640px){ .grid-area{padding:14px;} }
  .year-viewport{width:100%;height:100%;overflow:auto;}
  .year-scale-wrap{transform-origin:top left;width:100%;}
  .zoom-controls{display:flex;align-items:center;gap:4px;}
  .zoom-btn{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:14px;line-height:1;cursor:pointer;color:var(--navy);display:flex;align-items:center;justify-content:center;}
  .zoom-label{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--muted);min-width:52px;text-align:center;}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .weekday-row div{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7B8790;padding:6px 0;}
  .weekday-row div.we{color:#B5301F;}
  .week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .day-cell{position:relative;text-align:left;border-radius:10px;padding:6px 8px;min-height:78px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;}
  .day-cell.we{background:var(--weekend);}
  .day-cell.holiday{background:var(--holiday);}
  .day-cell.transfer{background:var(--transfer);}
  .day-cell.tentative{background:var(--tentative);}
  .day-cell.selected{border:2px solid var(--navy);}
  .day-cell.today{border:2px solid var(--gold);}
  .day-num{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text);}
  .day-num.red{color:#B5301F;}
  .hol-label{font-size:9.5px;line-height:1.2;margin-top:2px;color:#7A3226;}
  .school-bar{margin-top:auto;height:2px;border-radius:2px;background:var(--school);opacity:.45;}
  .day-cell.blackout{background-image:repeating-linear-gradient(135deg, rgba(139,58,58,0.12) 0 6px, transparent 6px 12px);}
  .day-cell.blackout .day-num{color:#8B3A3A;}
  .school-bar.tent{background:var(--school2);}
  .evt-chip{font-size:9.5px;line-height:1.3;padding:1px 5px;border-radius:5px;margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:2px;}
  .evt-more{font-size:9.5px;opacity:.5;padding:0 4px;}

  .empty-day{grid-column:span 1;}

  /* ---- year view ---- */
  .year-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .year-head h2{font-size:20px;margin:0;color:var(--navy);}
  .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .quarter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:900px){ .quarter-grid{grid-template-columns:1fr;} }
  .quarter-month{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;}
  .quarter-month-title{font-size:16px;font-weight:600;color:var(--navy);text-align:center;margin:0 0 10px;font-family:'Space Grotesk',sans-serif;}
  .mini-month{border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;background:#fff;cursor:pointer;}
  .mini-month.current{border:2px solid var(--gold);background:#FFFBF2;box-shadow:0 0 0 3px rgba(215,154,44,0.12);}
  .current-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);background:rgba(215,154,44,0.15);border-radius:999px;padding:1px 6px;vertical-align:middle;}
  .mini-month:hover{border-color:var(--gold);}
  .mini-month h3{font-size:calc(13px * var(--yfs,1));margin:0 0 8px;color:var(--navy);text-align:center;font-weight:600;}
  .mini-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;margin-bottom:3px;}
  .mini-wd div{text-align:center;font-size:calc(7px * var(--yfs,1));font-weight:700;color:#9aa5aa;letter-spacing:-0.3px;}
  .mini-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;margin-bottom:1.5px;}
  .mini-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:calc(9.5px * var(--yfs,1));border-radius:4px;position:relative;font-family:'IBM Plex Mono',monospace;color:var(--text);}
  .mini-day.we{background:var(--weekend);}
  .mini-day.holiday{background:var(--holiday);color:#7A3226;}
  .mini-day.transfer{background:var(--transfer);color:#6b4c12;}
  .mini-day.tentative{background:var(--tentative);color:#6b4c12;}
  .mini-day.today{outline:1.5px solid var(--gold);outline-offset:-1.5px;}
  .mini-day.selected{outline:1.5px solid var(--navy);outline-offset:-1.5px;}
  .mini-dot{position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--navy);}
  .mini-school{position:absolute;left:2px;right:2px;bottom:1px;height:1px;background:var(--school);opacity:.5;}
  .mini-day.blackout{background-image:repeating-linear-gradient(135deg, rgba(139,58,58,0.18) 0 4px, transparent 4px 8px);}

  /* ---- range select ---- */
  .range-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .range-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .range-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1200;}
  .range-hint{font-size:12.5px;color:var(--muted);}
  .day-cell.in-range{background:#F6E3BC !important;box-shadow:inset 0 0 0 2px var(--gold);}
  .day-cell.range-end{box-shadow:inset 0 0 0 2px #B5820F;}

  /* ---- day panel ---- */
  .day-panel{width:340px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);padding:22px;overflow-y:auto;}
  @media (max-width:1024px){ .day-panel{width:100%;border-left:none;border-top:1px solid var(--line);} }
  .weekday-name{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.5;font-weight:600;margin-bottom:4px;}
  .day-date{font-size:26px;font-weight:600;color:var(--navy);margin-bottom:16px;}
  .info-box{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;}
  .info-box.hol{background:#FBEBE9;color:#5B3A1F;}
  .info-box.sch{background:transparent;color:#5B7278;border:1px solid #E4EEF0;font-size:12px;padding:6px 10px;}
  .add-day-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #C9D1D5;background:transparent;border-radius:8px;padding:9px;font-size:14px;color:var(--muted);cursor:pointer;margin:14px 0;}
  .evt-card{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .evt-card-top{display:flex;justify-content:space-between;gap:8px;}
  .evt-left{display:flex;gap:8px;align-items:center;min-width:0;}
  .evt-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
  .evt-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evt-emp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evt-actions{display:flex;gap:4px;flex-shrink:0;}
  .evt-actions button{border:none;background:transparent;width:22px;height:22px;border-radius:5px;cursor:pointer;color:var(--muted);}
  .evt-actions button:hover{background:#f0f0f0;}
  .evt-dates{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9aa5aa;margin-top:6px;padding-left:32px;}
  .empty-hint{color:#a9b1b5;font-size:14px;text-align:center;padding:26px 0;}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(14,42,61,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h2{font-size:18px;margin:0;color:var(--navy);}
  .close-x{border:none;background:transparent;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--muted);}
  .close-x:hover{background:#f0f0f0;}
  label.field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:6px;}
  input[type=text], input[type=date], textarea, select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;margin-bottom:14px;}
  textarea{resize:none;}
  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .type-opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:14px;font-weight:500;background:#fff;color:var(--muted);cursor:pointer;}
  .type-opt.active{border-color:currentColor;}
  .date-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:11px;color:#a9b1b5;margin:-8px 0 12px;}
  .conflict-box{background:#FBEBE9;color:#7A2416;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  .conflict-box ul{margin:6px 0 0;padding-left:20px;}
  .conflict-box label{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:400;text-transform:none;letter-spacing:0;color:inherit;}
  .err{color:#c0392b;font-size:12px;margin-bottom:8px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .btn-ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;}
  .btn-dark{flex:1;border:none;background:var(--navy);color:#fff;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-dark:disabled{opacity:.4;cursor:default;}

  /* people manager */
  .people-add{display:flex;gap:8px;margin-bottom:16px;}
  .people-add input{margin-bottom:0;}
  .people-add button{border:none;background:var(--navy);color:#fff;border-radius:8px;padding:0 14px;font-size:18px;cursor:pointer;}
  .person-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .person-row span{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .person-row input{width:120px;margin:0;font-size:12px;padding:6px 8px;}
  .person-row button{border:none;background:transparent;color:#c0392b;width:26px;height:26px;border-radius:6px;cursor:pointer;}
  .person-row button:hover{background:#fdecea;}

  /* list view */
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#F7F8F7;}
  tbody td{padding:10px 14px;border-top:1px solid #EEF1F0;}
  .list-wrap{border:1px solid var(--line2);border-radius:12px;overflow:hidden;}
  .type-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .mono-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .row-actions button{border:none;background:transparent;width:24px;height:24px;border-radius:6px;cursor:pointer;color:var(--muted);}
  .row-actions button:hover{background:#f0f0f0;}
  .mobile-fab{display:none;position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--gold);border:none;color:#1a1200;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:40;}
  @media (max-width:900px){ .mobile-fab{display:block;} }
</style>
</head>
<body>
<div id="app"></div>

const SCHOOL_RANGES = [

/* ================= Helpers ================= */
const pad = n => String(n).padStart(2,"0");
const iso = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const todayISO = () => { const t=new Date(); return iso(t.getFullYear(),t.getMonth(),t.getDate()); };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const inRange = (d,s,e) => d>=s && d<=e;
const overlap = (aS,aE,bS,bE) => aS<=bE && aE>=bS;
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const mondayIdx = jsDay => jsDay===0?6:jsDay-1;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Закрытые периоды для отпусков (повторяются каждый год) ---- */
const BLACKOUT_RULES = [
  { fromM:1, fromD:1,  toM:1,  toD:15, label:"Первая половина января — закрытый период для отпусков" },
  { fromM:12,fromD:16, toM:12, toD:31, label:"Вторая половина декабря — закрытый период для отпусков" }
];
function blackoutRangesForYear(y){
  return BLACKOUT_RULES.map(r=>({
    start: `${y}-${pad(r.fromM)}-${pad(r.fromD)}`,
    end:   `${y}-${pad(r.toM)}-${pad(r.toD)}`,
    label: r.label
  }));
}
const BLACKOUT_RANGES = YEARS.flatMap(blackoutRangesForYear);
function blackoutInfo(d){ return BLACKOUT_RANGES.find(r=>inRange(d,r.start,r.end)) || null; }
function findBlackoutConflict(start,end){
  if(!start||!end) return null;
  return BLACKOUT_RANGES.find(r=>overlap(start,end,r.start,r.end)) || null;
}
/* ---- Мягкая подсказка: тот же сотрудник уже брал отпуск в похожий
   период (месяц/число ±5 дней) в другом году — не блокирует, просто
   намекает, что период может быть «востребованным». ---- */
function monthDayOffset(dateISO){
  const d = parseISO(dateISO);
  return d.getMonth()*31 + d.getDate();
}
function findRepeatPattern({events, employeeName, start, excludeId}){
  if(!employeeName || !start) return null;
  const startOffset = monthDayOffset(start);
  const startYear = start.slice(0,4);
  const hit = events.find(e=>{
    if(e.id===excludeId || e.type!=="vacation") return false;
    if(!sameName(e.employee, employeeName)) return false;
    if(e.start.slice(0,4)===startYear) return false; // only compare across different years
    return Math.abs(monthDayOffset(e.start)-startOffset) <= 5;
  });
  return hit || null;
}

/* ---- «Востребованные» дни: рабочие дни вплотную к длинным
   праздничным блокам (3+ подряд нерабочих дня). Не блокирует —
   только мягкая пометка на календаре и подсказка в форме. ---- */
function isNonWorking(d){
  const dt = parseISO(d), wd = dt.getDay();
  return wd===0 || wd===6 || !!PUBLIC_HOLIDAYS[d];
}
function computePopularDays(year){
  const days = [];
  for(let m=0;m<12;m++){ const total = daysInMonth(year,m); for(let day=1; day<=total; day++) days.push(iso(year,m,day)); }
  const clusters = [];
  let i=0;
  while(i<days.length){
    if(isNonWorking(days[i])){
      let j=i; while(j<days.length && isNonWorking(days[j])) j++;
      if(j-i>=3) clusters.push({start:days[i], end:days[j-1]});
      i=j;
    } else i++;
  }
  const set = new Set();
  const BUFFER = 3;
  clusters.forEach(c=>{
    const cs = parseISO(c.start), ce = parseISO(c.end);
    for(let k=1;k<=BUFFER;k++){
      const before = new Date(cs); before.setDate(before.getDate()-k);
      const bi = iso(before.getFullYear(), before.getMonth(), before.getDate());
      if(!isNonWorking(bi)) set.add(bi);
      const after = new Date(ce); after.setDate(after.getDate()+k);
      const ai = iso(after.getFullYear(), after.getMonth(), after.getDate());
      if(!isNonWorking(ai)) set.add(ai);
    }
  });
  return set;
}
const POPULAR_DAYS = new Set(YEARS.flatMap(y=>[...computePopularDays(y)]));
function hasPopularOverlap(start,end){
  if(!start||!end) return false;
  let d = parseISO(start); const endDt = parseISO(end);
  while(d<=endDt){
    if(POPULAR_DAYS.has(iso(d.getFullYear(),d.getMonth(),d.getDate()))) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

function monthGrid(y,m){
  const first = new Date(y,m,1);
  const offset = mondayIdx(first.getDay());
  const total = daysInMonth(y,m);
  const cells=[];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1;d<=total;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  while(cells.length<42) cells.push(null);
  const weeks=[];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function schoolInfo(d){ return SCHOOL_RANGES.find(r=>inRange(d,r.start,r.end)) || null; }
function eventsOnDay(events,d){ return events.filter(e=>inRange(d,e.start,e.end)); }
function findEmployee(list,name){
  const n=(name||"").trim().toLowerCase(); if(!n) return null;
  return list.find(e=>e.name.trim().toLowerCase()===n) || null;
}
function employeeGroups(emp){
  return (emp && emp.group || "").split(",").map(s=>s.trim()).filter(Boolean);
}
function sameName(a,b){ return (a||"").trim().toLowerCase() === (b||"").trim().toLowerCase(); }

/* Two kinds of "must not overlap" relations:
   1) shared functional group (symmetric — any peer in the same tag)
   2) supervisor <-> deputy (directed pair via employee.reportsTo — does NOT
      make deputies conflict with each other, only each with the supervisor) */
function findConflicts({events,employees,employeeName,start,end,excludeId}){
  if(!employeeName||!start||!end) return [];
  const me = findEmployee(employees,employeeName);
  if(!me) return [];
  const myGroups = employeeGroups(me);
  const conflictNames = new Set();
  employees.forEach(other=>{
    if(other.id===me.id) return;
    const otherGroups = employeeGroups(other);
    const sharedGroup = myGroups.some(g=>otherGroups.includes(g));
    const meIsSupervisorOfOther = other.reportsTo && sameName(other.reportsTo, me.name);
    const meReportsToOther = me.reportsTo && sameName(me.reportsTo, other.name);
    if(sharedGroup || meIsSupervisorOfOther || meReportsToOther) conflictNames.add(other.name.trim().toLowerCase());
  });
  if(conflictNames.size===0) return [];
  return events.filter(e=> e.id!==excludeId && e.type==="vacation" && conflictNames.has((e.employee||"").trim().toLowerCase()) && overlap(start,end,e.start,e.end));
}

/* ---- Фактически использованные дни отпуска — считаются В РАМКАХ
   ОДНОГО КАЛЕНДАРНОГО ГОДА (как того требует трудовое законодательство:
   отпуск начисляется и учитывается по годам). Дни отпуска, попавшие
   в другой год (переходящий через 31 декабря), в этот год не входят.
   Из дней года учитываются только уже наступившие (по сегодня). ---- */
function usedVacationDays(employeeName, events, year){
  const yStart = `${year}-01-01`, yEnd = `${year}-12-31`;
  const today = todayISO();
  return (events||[]).reduce((sum,e)=>{
    if(e.type!=="vacation" || !sameName(e.employee, employeeName)) return sum;
    const s = e.start > yStart ? e.start : yStart;
    let en = e.end < yEnd ? e.end : yEnd;
    if(s > en) return sum;         // отпуск не затрагивает этот год
    if(s > today) return sum;      // ещё не начался
    if(en > today) en = today;     // считаем только по сегодня
    const days = Math.round((parseISO(en) - parseISO(s)) / 86400000) + 1;
    return sum + Math.max(0, days);
  }, 0);
}

/* ---- Напоминания: в день события и за 1 рабочий день до него.
   «1 рабочий день до» — ближайший предшествующий рабочий день
   (пропускает выходные и праздники), а не просто «вчера». Работает,
   пока вкладка с календарём открыта — это статичный сайт без сервера,
   «настоящие» пуш-уведомления при закрытой вкладке технически
   невозможны без бэкенда. ---- */
function isBusinessDay(d){
  const wd = parseISO(d).getDay();
  return wd!==0 && wd!==6 && !PUBLIC_HOLIDAYS[d];
}
function businessDayBefore(d){
  const dt = parseISO(d);
  do{ dt.setDate(dt.getDate()-1); } while(!isBusinessDay(iso(dt.getFullYear(),dt.getMonth(),dt.getDate())));
  return iso(dt.getFullYear(),dt.getMonth(),dt.getDate());
}
function getTodayAlerts(){
  const today = todayISO();
  return state.events
    .filter(e=> e.start===today || businessDayBefore(e.start)===today)
    .map(e=>({ event:e, kind: e.start===today ? "today" : "reminder" }));
}
function checkAndFireNotifications(){
  if(typeof Notification==="undefined" || Notification.permission!=="granted") return;
  const today = todayISO();
  const key = "kz-notified-"+today;
  let notified = [];
  try{ notified = JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){}
  getTodayAlerts().forEach(({event,kind})=>{
    if(notified.includes(event.id)) return;
    const t = EVENT_TYPES[event.type];
    const title = kind==="today" ? `Сегодня: ${t.label}` : `Завтра (рабочий день): ${t.label}`;
    try{ new Notification(title, { body: `${event.employee||event.title||t.label} — ${event.start}`, tag: event.id }); }catch(e){}
    notified.push(event.id);
  });
  localStorage.setItem(key, JSON.stringify(notified));
}
function requestNotifPermission(){
  if(typeof Notification==="undefined") return;
  Notification.requestPermission().then(()=>{ checkAndFireNotifications(); rerender(); });
}
function dismissNotifBanner(){ state.notifDismissedDate = todayISO(); rerender(); }
function notifBannerHTML(){
  const alerts = getTodayAlerts();
  if(alerts.length===0 || state.notifDismissedDate===todayISO()) return "";
  const canAsk = typeof Notification!=="undefined" && Notification.permission==="default";
  return `<div style="background:#FCF3E1;border-bottom:1px solid #E9D6A0;padding:9px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-weight:600;color:#6b4c12;font-size:13px">🔔 Напоминания:</span>
    ${alerts.map(({event,kind})=>{
      const t = EVENT_TYPES[event.type];
      const label = kind==="today" ? "сегодня" : "завтра (раб. день)";
      return `<span style="font-size:12.5px;background:#fff;border-radius:999px;padding:3px 10px;color:#6b4c12">${t.icon} ${esc(event.employee||event.title||t.label)} — ${label}</span>`;
    }).join("")}
    ${canAsk ? `<button onclick="requestNotifPermission()" style="border:none;background:#6b4c12;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">Включить уведомления браузера</button>` : ""}
    <button onclick="dismissNotifBanner()" style="margin-left:auto;border:none;background:transparent;color:#6b4c12;cursor:pointer;font-size:12.5px;text-decoration:underline">Скрыть</button>
  </div>`;
}

function load(){
  try{ state.events = JSON.parse(localStorage.getItem("kz2027-events")||"[]"); }catch(e){ state.events=[]; }
  const rawEmp = localStorage.getItem("kz2027-employees");
  if(rawEmp===null){
    state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, id:uid()}));
  } else {
    try{ const p = JSON.parse(rawEmp); state.employees = Array.isArray(p) ? p : []; }catch(e){ state.employees=[]; }
  }

function persist(){
  localStorage.setItem("kz2027-events", JSON.stringify(state.events));

}

/* ---- Резервная копия: полезно, если браузер часто чистит кэш —
   localStorage при этом стирается, но данные можно быстро вернуть
   из скачанного файла. ---- */
function exportBackup(){
  const payload = {
    app: "kz-planner",
    exportedAt: new Date().toISOString(),
    events: state.events,
    employees: state.employees
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `kz-planner-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  localStorage.setItem("kz-last-backup", todayISO());
  state.backupBannerDismissed = todayISO();
  rerender();
}
/* ---- Напоминание про бэкап: настоящее авто-скачивание при закрытии
   вкладки браузеры блокируют (защита от навязчивых сайтов), поэтому
   вместо него — ненавязчивое напоминание, если копии давно не было. ---- */
function daysSinceLastBackup(){
  const last = localStorage.getItem("kz-last-backup");
  if(!last) return Infinity;
  return Math.floor((parseISO(todayISO()) - parseISO(last)) / 86400000);
}
function dismissBackupBanner(){ state.backupBannerDismissed = todayISO(); rerender(); }
function backupBannerHTML(){
  if(state.events.length===0 && state.employees.length===0) return "";
  if(state.backupBannerDismissed===todayISO()) return "";
  const days = daysSinceLastBackup();
  if(days < 3) return "";
  const msg = days===Infinity ? "Резервной копии ещё не было" : `Последняя копия — ${days} ${days===1?'день':days<5?'дня':'дней'} назад`;
  return `<div style="background:#E7F4F7;border-bottom:1px solid #C9E4EA;padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:13px;color:#0E4C58">💾 ${msg}. Браузер может почистить кэш и стереть данные — стоит сохранить копию.</span>
    <button onclick="exportBackup()" style="border:none;background:#0E4C58;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">Скачать копию</button>
    <button onclick="dismissBackupBanner()" style="margin-left:auto;border:none;background:transparent;color:#0E4C58;cursor:pointer;font-size:12.5px;text-decoration:underline">Скрыть</button>
  </div>`;
}
function importBackup(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.events) || !Array.isArray(data.employees)) throw new Error("bad format");
      const replace = confirm(`В файле: ${data.events.length} событий и ${data.employees.length} сотрудников.\n\nОК — заменить текущие данные этим файлом.\nОтмена — не трогать текущие данные.`);
      if(!replace) return;
      state.events = data.events;
      state.employees = data.employees;
      persist();
      localStorage.setItem("kz-last-backup", todayISO());
      state.backupBannerDismissed = todayISO();
      rerender();
    }catch(e){
      alert("Не удалось прочитать файл — убедитесь, что это резервная копия, скачанная из этого же приложения.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

function ensureEmployee(name){
  const trimmed=(name||"").trim(); if(!trimmed) return;
  if(!findEmployee(state.employees,trimmed)) state.employees.push({id:uid(),name:trimmed,group:"",reportsTo:""});
}

            <button class="${state.view==='grid'?'active':''}" onclick="setView('grid')">▦ Месяц</button>
            <button class="${state.view==='list'?'active':''}" onclick="setView('list')">☰ Список</button>
          </div>

      <div class="month-tabs">
        ${MONTHS.map((m,i)=>`<button class="month-tab ${i===state.month?'active':''}" onclick="goMonth(${i})">${m.slice(0,3).toUpperCase()}</button>`).join("")}
      </div>` : ""}
      <div class="body-flex">
        <div class="grid-area">${state.view==='grid'?gridHTML():state.view==='year'?`<div id="year-viewport" class="year-viewport"><div id="year-scale-wrap" class="year-scale-wrap" style="--yfs:${state.yearFontScale}">${yearHTML()}</div></div>`:state.view==='quarter'?quarterHTML():listHTML()}</div>

  if(state.view==="year") requestAnimationFrame(layoutYearZoom);
}

function groupsSection(){
  const groups = [...new Set(state.employees.flatMap(e=>employeeGroups(e)))];
  const supervisors = [...new Set(state.employees.map(e=>e.reportsTo).filter(Boolean))];
  if(groups.length===0 && supervisors.length===0) return "";
  return `<div class="side-section">
    <div class="side-label">Группы взаимозаменяемости</div>
    ${groups.map(g=>`<div class="legend-row" style="justify-content:space-between"><span>${esc(g)}</span><span class="font-mono" style="opacity:.5;font-size:11px">${state.employees.filter(e=>employeeGroups(e).includes(g)).length}</span></div>`).join("")}
    ${supervisors.map(s=>`<div class="legend-row" style="justify-content:space-between"><span>${esc(s)} (руководитель)</span><span class="font-mono" style="opacity:.5;font-size:11px">${state.employees.filter(e=>sameName(e.reportsTo,s)).length}</span></div>`).join("")}
  </div>`;
}

function visibleEvents(){ return state.events.filter(e=>state.typeFilter.has(e.type)); }

function monthBlockHTML(monthIndex){
  const weeks = monthGrid(state.year, monthIndex);
  const today = todayISO();
  const ev = visibleEvents();
  let html = `<div class="weekday-row">${WD.map((w,i)=>`<div class="${i>=5?'we':''}">${w}</div>`).join("")}</div>`;
  weeks.forEach(week=>{
    html += `<div class="week-row">`;
    week.forEach((day,di)=>{
      if(day===null){ html+=`<div></div>`; return; }
      const d = iso(state.year, monthIndex, day);
      const we = di>=5;
      const hol = PUBLIC_HOLIDAYS[d];
      const sch = schoolInfo(d);
      const bo = blackoutInfo(d);
      const dayEv = eventsOnDay(ev,d);
      const sel = d===state.selected;
      const isToday = d===today;
      const inRange = state.rangeMode && state.rangeStart && d>=state.rangeStart && d<=state.rangeEnd;
      let cls = "day-cell";
      if(hol) cls += " "+hol.kind;
      else if(we) cls += " we";
      if(bo) cls += " blackout";
      if(inRange) cls += " in-range";
      if(inRange && (d===state.rangeStart || d===state.rangeEnd)) cls += " range-end";
      if(!state.rangeMode){ if(sel) cls += " selected"; else if(isToday) cls += " today"; }
      const rangeHandlers = state.rangeMode
        ? `onmousedown="startDrag('${d}')" onmouseenter="dragOver('${d}')" ontouchstart="startDrag('${d}')" ontouchmove="handleTouchMove(event)"`
        : `onclick="selectDay('${d}')" ondblclick="openNewEvent('${d}')"`;
      html += `<div class="${cls}" data-date="${d}" ${rangeHandlers} title="${esc([hol?hol.label:'', bo?bo.label:''].filter(Boolean).join(' · '))}">
        <div class="day-num ${(we||hol)?'red':''}">${day}</div>
        ${hol?`<div class="hol-label">${esc(hol.label)}</div>`:""}
        ${sch?`<div class="school-bar ${sch.confirmed?'':'tent'}"></div>`:""}
        ${dayEv.slice(0,2).map(e=>{
          const conflict = e.type==="vacation" && findConflicts({events:ev,employees:state.employees,employeeName:e.employee,start:e.start,end:e.end,excludeId:e.id}).length>0;
          const t = EVENT_TYPES[e.type];
          return `<div class="evt-chip" style="background:color-mix(in srgb, ${t.color} 15%, white);color:${t.color}">${conflict?'⚠':''}${esc(e.employee||e.title||t.label)}</div>`;
        }).join("")}
        ${dayEv.length>2?`<div class="evt-more">+${dayEv.length-2} ещё</div>`:""}
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function gridHTML(){
  let html = `<div class="range-toolbar">
    <button class="range-btn ${state.rangeMode?'active':''}" onclick="toggleRangeMode()">🗓 ${state.rangeMode?'Отменить выбор периода':'Выбрать несколько дней'}</button>
    ${state.rangeMode?`<span class="range-hint">${!state.rangeStart?'Нажмите и потяните по дням, чтобы выбрать период':'Период: '+parseISO(state.rangeStart).getDate()+' '+MONTHS[parseISO(state.rangeStart).getMonth()].toLowerCase()+' → '+parseISO(state.rangeEnd).getDate()+' '+MONTHS[parseISO(state.rangeEnd).getMonth()].toLowerCase()}</span>`:""}
  </div>`;
  html += monthBlockHTML(state.month);
  return html;
}

const QUARTER_NAMES = ["I квартал", "II квартал", "III квартал", "IV квартал"];
function quarterHTML(){
  const q = Math.floor(state.month/3);
  const months = [q*3, q*3+1, q*3+2];
  return `<div class="quarter-grid">${months.map(m=>`
    <div class="quarter-month">
      <h3 class="quarter-month-title">${MONTHS[m]}</h3>
      ${monthBlockHTML(m)}
    </div>`).join("")}</div>`;
}

function yearHTML(){
  const today = todayISO();
  const ev = visibleEvents();
  const now = new Date();
  const isCurrentYear = state.year === now.getFullYear();
  let html = `<div class="year-grid">`;
  for(let m=0;m<12;m++){
    const weeks = monthGrid(state.year, m);
    const isCurrentMonth = isCurrentYear && m===now.getMonth();
    html += `<div class="mini-month${isCurrentMonth?' current':''}" onclick="goYearMonth(${m})">
      <h3>${MONTHS[m]}${isCurrentMonth?' <span class="current-tag">сейчас</span>':''}</h3>
      <div class="mini-wd">${WD.map((w,i)=>`<div style="${i>=5?'color:#B5301F':''}">${w}</div>`).join("")}</div>`;
    weeks.forEach(week=>{
      html += `<div class="mini-week">`;
      week.forEach((day,di)=>{
        if(day===null){ html+=`<div></div>`; return; }
        const d = iso(state.year, m, day);
        const we = di>=5;
        const hol = PUBLIC_HOLIDAYS[d];
        const sch = schoolInfo(d);
        const bo = blackoutInfo(d);
        const hasEv = eventsOnDay(ev,d).length>0;
        let cls = "mini-day";
        if(hol) cls += " "+hol.kind;
        else if(we) cls += " we";
        if(bo) cls += " blackout";
        if(d===today) cls += " today";
        if(d===state.selected) cls += " selected";
        html += `<div class="${cls}" title="${esc([hol?hol.label:'', bo?bo.label:''].filter(Boolean).join(' · '))}" onclick="event.stopPropagation(); pickYearDay('${d}', ${m})">${day}${hasEv?'<span class="mini-dot"></span>':''}${sch?'<span class="mini-school"></span>':''}</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function listHTML(){
  const yStart = `${state.year}-01-01`, yEnd = `${state.year}-12-31`;
  const ev = [...visibleEvents()].filter(e=>overlap(e.start,e.end,yStart,yEnd)).sort((a,b)=>a.start.localeCompare(b.start));
  const yearNote = `<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Показаны события, попадающие в <b>${state.year}</b> год (переключается кнопкой года в шапке).</p>`;
  if(ev.length===0) return yearNote + `<div class="empty-hint" style="padding:40px 0">Событий за ${state.year} год нет. Нажмите «Новое событие», чтобы запланировать отпуск, командировку или встречу.</div>`;
  return yearNote + `<div class="list-wrap"><table>
    <thead><tr><th>Тип</th><th>Название</th><th>Сотрудник</th><th>Начало</th><th>Окончание</th><th></th></tr></thead>
    <tbody>
    ${ev.map(e=>{
      const t = EVENT_TYPES[e.type];
      const conflicts = e.type==="vacation" ? findConflicts({events:ev,employees:state.employees,employeeName:e.employee,start:e.start,end:e.end,excludeId:e.id}) : [];
      return `<tr>
        <td><span class="type-pill" style="background:color-mix(in srgb, ${t.color} 15%, white);color:${t.color}">${t.icon} ${t.label}</span></td>
        <td>${esc(e.title)||"—"}</td>
        <td>${conflicts.length?`<span title="Пересекается: ${conflicts.map(c=>esc(c.employee)+' ('+c.start+'–'+c.end+')').join(', ')}">⚠ </span>`:""}${esc(e.employee)||"—"}</td>
        <td class="mono-cell">${e.start}</td>
        <td class="mono-cell">${e.end}</td>
        <td><div class="row-actions">
          <button onclick="openEditEvent('${e.id}')">✎</button>
          <button onclick="removeEvent('${e.id}')" style="color:#c0392b">🗑</button>
        </div></td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}

function dayPanelHTML(){
  if(state.rangeMode){
    const s = state.rangeStart, e = state.rangeEnd;
    return `
      <div class="weekday-name">Выбор периода</div>
      <div class="day-date font-display" style="font-size:20px">${
        !s ? "Потяните по дням в календаре" :
        parseISO(s).getDate()+" "+MONTHS[parseISO(s).getMonth()].toLowerCase()+" → "+parseISO(e).getDate()+" "+MONTHS[parseISO(e).getMonth()].toLowerCase()
      }</div>
      <p style="font-size:13px;color:var(--muted);margin-top:0">Нажмите на день в календаре и, не отпуская, проведите пальцем (или мышью) до последнего дня периода.</p>
      <button class="add-day-btn" ${(!s)?"disabled style='opacity:.4'":""} onclick="openRangeEvent()">+ Добавить событие на этот период</button>
      <button class="range-btn" style="width:100%;justify-content:center" onclick="toggleRangeMode()">Отменить выбор</button>
    `;
  }
  const d = state.selected;
  const dt = parseISO(d);
  const hol = PUBLIC_HOLIDAYS[d];
  const sch = schoolInfo(d);
  const bo = blackoutInfo(d);
  const pop = POPULAR_DAYS.has(d);
  const dayEv = eventsOnDay(visibleEvents(), d);
  return `
    <div class="weekday-name">${WEEKDAY_FULL[dt.getDay()]}</div>
    <div class="day-date font-display">${dt.getDate()} ${MONTHS[dt.getMonth()].toLowerCase()}</div>
    ${hol?`<div class="info-box hol">ⓘ ${esc(hol.label)}</div>`:""}
    ${bo?`<div class="info-box" style="background:#F5D9D9;color:#7A1F1F">⚠ ${esc(bo.label)} — не запрещено, но желательно согласовать заранее</div>`:""}
    ${pop?`<div class="info-box" style="background:#FCF3E1;color:#6b4c12">★ Рядом с длинными праздниками — обычно повышенный спрос на отпуск</div>`:""}
    ${sch?`<div class="info-box sch">📅 ${esc(sch.label)}${sch.confirmed?"":" — дата ориентировочная"}</div>`:""}
    <button class="add-day-btn" onclick="openNewEvent('${d}')">+ Добавить событие на этот день</button>
    ${dayEv.length===0?`<div class="empty-hint">Событий нет</div>`:dayEv.map(e=>{
      const t=EVENT_TYPES[e.type];
      return `<div class="evt-card">
        <div class="evt-card-top">
          <div class="evt-left">
            <div class="evt-icon" style="background:color-mix(in srgb, ${t.color} 18%, white);color:${t.color}">${t.icon}</div>
            <div><div class="evt-title">${esc(e.title)||t.label}</div>${e.employee?`<div class="evt-emp">${esc(e.employee)}</div>`:""}</div>
          </div>
          <div class="evt-actions"><button onclick="openEditEvent('${e.id}')">✎</button><button onclick="removeEvent('${e.id}')" style="color:#c0392b">🗑</button></div>
        </div>
        <div class="evt-dates">${e.start===e.end?e.start:e.start+" → "+e.end}</div>
      </div>`;
    }).join("")}
  `;
}

/* ---- Event form modal ---- */
function formModalHTML(){
  const editing = state.editingId ? state.events.find(e=>e.id===state.editingId) : null;
  const draft = state.formDraft;
  const matched = findEmployee(state.employees, draft.employee);
  const conflicts = draft.type==="vacation" ? findConflicts({events:state.events,employees:state.employees,employeeName:draft.employee,start:draft.start,end:draft.end,excludeId:editing?editing.id:null}) : [];
  const blackout = draft.type==="vacation" ? findBlackoutConflict(draft.start, draft.end) : null;
  const repeatHit = draft.type==="vacation" ? findRepeatPattern({events:state.events, employeeName:draft.employee, start:draft.start, excludeId:editing?editing.id:null}) : null;
  const popularHit = draft.type==="vacation" && hasPopularOverlap(draft.start, draft.end);
  const blocked = (conflicts.length && !draft.override);
  return `<div class="overlay" onclick="if(event.target===this) closeForm()">
    <div class="modal">
      <div class="modal-head"><h2 class="font-display">${editing?"Изменить событие":"Новое событие"}</h2><button class="close-x" onclick="closeForm()">✕</button></div>
      <label class="field-label">Тип события</label>
      <div class="type-grid">
        ${Object.entries(EVENT_TYPES).map(([k,t])=>`
          <div class="type-opt ${draft.type===k?'active':''}" style="color:${draft.type===k?t.color:'var(--muted)'};border-color:${draft.type===k?t.color:'var(--line2)'}" onclick="setDraftField('type','${k}')">${t.icon} ${t.label}</div>
        `).join("")}
      </div>
      <label class="field-label">Сотрудник</label>
      <input type="text" id="employee-input" list="employee-options" value="${esc(draft.employee)}" oninput="setDraftField('employee', this.value)" placeholder="Начните вводить имя…">
      <datalist id="employee-options">${state.employees.map(e=>`<option value="${esc(e.name)}">`).join("")}</datalist>
      ${draft.employee && !matched ? `<div class="hint">Новый сотрудник — добавится в справочник при сохранении.</div>` : ""}
      ${matched && !matched.group && !matched.reportsTo ? `<div class="hint">У сотрудника не указаны группа или руководитель — проверка пересечений не выполняется.</div>` : ""}
      <label class="field-label">Название (необязательно)</label>
      <input type="text" id="title-input" value="${esc(draft.title)}" oninput="setDraftField('title', this.value)" placeholder="Например, Отпуск перед отчётным периодом">
      <div class="date-grid" style="${draft.type==='birthday'?'grid-template-columns:1fr':''}">
        <div><label class="field-label">${draft.type==='birthday'?'Дата':'Начало'}</label><input type="date" min="2026-01-01" max="2027-12-31" value="${draft.start}" oninput="setDraftField('start', this.value)"></div>
        ${draft.type==='birthday' ? "" : `<div><label class="field-label">Окончание</label><input type="date" min="2026-01-01" max="2027-12-31" value="${draft.end}" oninput="setDraftField('end', this.value)"></div>`}
      </div>
      ${blackout ? `
        <div class="hint" style="background:#F5D9D9;color:#7A1F1F;border-radius:8px;padding:8px 10px;margin:-4px 0 12px">
          ⚠ ${esc(blackout.label)}. Отпуск в это время не запрещён, но лучше согласовать заранее.
        </div>` : ""}
      ${popularHit ? `
        <div class="hint" style="background:#FCF3E1;color:#6b4c12;border-radius:8px;padding:8px 10px;margin:-4px 0 12px">
          ★ Этот период рядом с длинными праздниками — обычно повышенный спрос на отпуск, стоит согласовать очерёдность с командой.
        </div>` : ""}
      ${repeatHit ? `
        <div class="hint" style="background:#FCF3E1;color:#6b4c12;border-radius:8px;padding:8px 10px;margin:-4px 0 12px">
          💡 У этого сотрудника уже был отпуск в похожий период (${repeatHit.start} → ${repeatHit.end}) в другом году — возможно, период «удачный», стоит проверить справедливость по очереди.
        </div>` : ""}
      ${conflicts.length ? `
        <div class="conflict-box">
          <div>⚠ Пересечение с отпуском взаимозаменяемого сотрудника:</div>
          <ul>${conflicts.map(c=>`<li>${esc(c.employee)}: ${c.start} → ${c.end}</li>`).join("")}</ul>
          <label><input type="checkbox" ${draft.override?"checked":""} onchange="setDraftField('override', this.checked)"> Всё равно сохранить (беру ответственность за пересечение)</label>
        </div>` : ""}
      <label class="field-label">Заметка</label>
      <textarea id="note-input" rows="2" oninput="setDraftField('note', this.value)" placeholder="Необязательно">${esc(draft.note)}</textarea>
      ${draft.error?`<div class="err">${esc(draft.error)}</div>`:""}
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeForm()">Отмена</button>
        <button class="btn-dark" ${blocked ? "disabled":""} onclick="submitForm()">${editing?"Сохранить":"Добавить"}</button>
      </div>
    </div>
  </div>`;
}

function peopleModalHTML(){
  const groups = [...new Set(state.employees.flatMap(e=>employeeGroups(e)))];
  return `<div class="overlay" onclick="if(event.target===this) closePeople()">
    <div class="modal">
      <div class="modal-head"><h2 class="font-display">Сотрудники и группы</h2><button class="close-x" onclick="closePeople()">✕</button></div>
      <p style="font-size:13px;color:var(--muted);margin-top:0">
        <b>Группа</b> — придумайте общий ярлык для взаимозаменяемых сотрудников (например «Смена А»). У кого он совпадает дословно — не смогут взять отпуск на одни даты. Через запятую можно вписать несколько.<br><br>
        <b>Чей заместитель</b> — впишите имя начальника <u>в строке подчинённого</u>. Пример: если Нурлыбек подчиняется Кисиковой — в поле у <u>Нурлыбека</u> пишем «Кисикова». Тогда именно эти двое не пересекутся по отпуску, а другие заместители того же начальника — могут.
      </p>
      <div class="people-add">
        <input type="text" id="new-emp-name" placeholder="Имя сотрудника">
        <button onclick="addPerson()">+</button>
      </div>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;background:#F0F2F1;border-radius:8px;padding:8px 10px">
        📊 Дни отпуска ниже посчитаны за <b>${state.year} год</b> (переключается той же кнопкой года в шапке) — по закону отпуск учитывается в рамках календарного года.
      </p>
      <datalist id="group-options">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
      ${state.employees.length===0?`<div class="empty-hint">Сотрудников пока нет — добавьте здесь или впишите имя прямо в форме события.</div>`:
        state.employees.map(e=>{
          const used = usedVacationDays(e.name, state.events, state.year);
          const otherNames = state.employees.filter(x=>x.id!==e.id);
          return `<div class="person-row" style="flex-direction:column;align-items:stretch;gap:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-weight:600">${esc(e.name)}</span>
            <span class="font-mono" style="font-size:11px;color:var(--muted);background:#F0F2F1;border-radius:999px;padding:2px 8px;white-space:nowrap" title="Фактически использовано дней отпуска за ${state.year} год (на сегодня)">🏖 ${used} дн. · ${state.year}</span>
            <button onclick="removePerson('${e.id}')">🗑</button>
          </div>
          <div style="display:flex;gap:6px">
            <input type="text" value="${esc(e.group)}" list="group-options" placeholder="Группа (свой ярлык)" style="flex:1;font-size:12px" onchange="updatePersonField('${e.id}','group', this.value)">
            <input type="text" value="${esc(e.reportsTo||'')}" list="boss-options-${e.id}" placeholder="Чей заместитель" style="width:130px;font-size:12px" onchange="updatePersonField('${e.id}','reportsTo', this.value)">
            <datalist id="boss-options-${e.id}">${otherNames.map(o=>`<option value="${esc(o.name)}">`).join("")}</datalist>
          </div>
        </div>`;
        }).join("")}
      <button class="btn-dark" style="width:100%;margin-top:8px" onclick="closePeople()">Готово</button>
    </div>
  </div>`;
}

/* ================= Actions ================= */
/* rerender() repaints the whole app but restores focus + cursor position
   on the active input afterwards, so typing doesn't get interrupted. */
function rerender(){
  const active = document.activeElement;
  const id = active && active.id;
  let selStart=null, selEnd=null;
  if(active && typeof active.selectionStart === "number"){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  render();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function changeMonth(delta){ state.month = Math.min(11, Math.max(0, state.month+delta)); rerender(); }
function changeQuarter(delta){
  const q = Math.floor(state.month/3);
  const nq = Math.min(3, Math.max(0, q+delta));
  state.month = nq*3;
  rerender();
}
function goMonth(i){ state.month = i; if(state.view==='year') state.view='grid'; rerender(); }
function goYearMonth(m){ state.month = m; state.view = 'grid'; rerender(); }
function pickYearDay(d, m){ state.selected = d; state.month = m; state.view = 'grid'; rerender(); }
function setView(v){ state.view = v; rerender(); }
function setYear(y){ state.year = y; state.month = 0; state.rangeMode=false; state.rangeStart=null; state.rangeEnd=null; rerender(); }

/* ---- Year-view layout: fixed 3 months per row (4 rows — quarterly
   layout), scaled up or down to fill the page as evenly as possible
   with no dead zones and no scrolling. Column count is fixed (not
   auto-picked anymore); only the scale is computed. Recomputed on
   every render and on window resize. Text size is a separate,
   independent control (Aa−/Aa+). ---- */
function layoutYearZoom(){
  if(state.view!=="year") return;
  const viewport = document.getElementById("year-viewport");
  const wrap = document.getElementById("year-scale-wrap");
  const grid = wrap && wrap.querySelector(".year-grid");
  if(!viewport || !wrap || !grid) return;
  wrap.style.zoom = 1;
  grid.style.gridTemplateColumns = "repeat(3,1fr)";
  const availW = viewport.clientWidth, availH = viewport.clientHeight;
  const natW = wrap.scrollWidth, natH = wrap.scrollHeight;
  if(availW===0 || availH===0 || natW===0 || natH===0) return;
  const fitScale = Math.max(0.1, Math.min(availW/natW, availH/natH, 2.5));
  state.yearFitScale = fitScale;
  wrap.style.zoom = fitScale;
}
/* Independent font-size control for the year view — changes the
   natural size of the text, then layoutYearZoom() re-fits around it
   automatically, so the page still stays evenly filled. */
function fontIn(){ state.yearFontScale = Math.min(1.6, +(state.yearFontScale+0.1).toFixed(2)); rerender(); }
function fontOut(){ state.yearFontScale = Math.max(0.7, +(state.yearFontScale-0.1).toFixed(2)); rerender(); }
window.addEventListener("resize", ()=>{ if(state.view==="year") layoutYearZoom(); });
function selectDay(d){ state.selected = d; rerender(); }
function toggleRangeMode(){
  state.rangeMode = !state.rangeMode;
  state.rangeStart = null;
  state.rangeEnd = null;
  isDragging = false;
  dragAnchor = null;
  lastDragDate = null;
  rerender();
}
/* ---- Drag-to-select a period (mouse drag or touch swipe) ---- */
let isDragging = false;
let dragAnchor = null;
let lastDragDate = null;
function startDrag(d){
  isDragging = true;
  dragAnchor = d;
  lastDragDate = d;
  state.rangeStart = d;
  state.rangeEnd = d;
  state.selected = d;
  rerender();
}
function dragOver(d){
  if(!isDragging || d===lastDragDate) return;
  lastDragDate = d;
  if(d < dragAnchor){ state.rangeStart = d; state.rangeEnd = dragAnchor; }
  else { state.rangeStart = dragAnchor; state.rangeEnd = d; }
  rerender();
}
function handleTouchMove(ev){
  if(!isDragging) return;
  ev.preventDefault();
  const t = ev.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const cell = el && el.closest ? el.closest('[data-date]') : null;
  if(cell) dragOver(cell.getAttribute('data-date'));
}
function endDrag(){ isDragging = false; }
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
document.addEventListener("touchcancel", endDrag);

function openRangeEvent(){
  if(!state.rangeStart) return;
  const start = state.rangeStart;
  const end = state.rangeEnd || state.rangeStart;
  state.rangeMode = false;
  state.rangeStart = null;
  state.rangeEnd = null;
  state.editingId = null;
  state.selected = start;
  state.formDraft = { type:"vacation", title:"", employee:"", start, end, note:"", error:"", override:false };
  state.formOpen = true;
  rerender();
}
function toggleFilter(k){
  state.typeFilter.has(k) ? state.typeFilter.delete(k) : state.typeFilter.add(k);
  syncFilterURL();
  rerender();
}
/* ---- Слои событий: показать только один тип (например, только
   отпуска, на фоне обычных праздников/выходных), со ссылкой в адресной
   строке — можно скопировать, отправить или добавить в закладки, и она
   откроется сразу с этим фильтром. ---- */
function onlyFilter(k){
  state.typeFilter = new Set([k]);
  syncFilterURL();
  rerender();
}
function resetFilter(){
  state.typeFilter = new Set(Object.keys(EVENT_TYPES));
  syncFilterURL();
  rerender();
}
function syncFilterURL(){
  const all = Object.keys(EVENT_TYPES);
  const url = new URL(location.href);
  if(state.typeFilter.size === all.length){
    url.searchParams.delete("layer");
  } else {
    url.searchParams.set("layer", [...state.typeFilter].join(","));
  }
  history.replaceState(null, "", url.toString());
}
function copyFilterLink(){
  syncFilterURL();
  const link = location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(
      ()=>alert("Ссылка скопирована:\n"+link),
      ()=>prompt("Скопируйте ссылку вручную:", link)
    );
  } else {
    prompt("Скопируйте ссылку вручную:", link);
  }
}
function applyFilterFromURL(){
  const raw = new URLSearchParams(location.search).get("layer");
  if(!raw) return;
  const valid = raw.split(",").map(s=>s.trim()).filter(k=>EVENT_TYPES[k]);
  if(valid.length) state.typeFilter = new Set(valid);
}

function openNewEvent(dateISO){
  state.editingId = null;
  state.selected = dateISO;
  state.formDraft = { type:"vacation", title:"", employee:"", start:dateISO, end:dateISO, note:"", error:"", override:false };
  state.formOpen = true;
  rerender();
}
function openEditEvent(id){
  const e = state.events.find(x=>x.id===id);
  state.editingId = id;
  state.formDraft = { type:e.type, title:e.title||"", employee:e.employee||"", start:e.start, end:e.end, note:e.note||"", error:"", override:false };
  state.formOpen = true;
  rerender();
}
function closeForm(){ state.formOpen=false; state.editingId=null; state.formDraft=null; rerender(); }
function setDraftField(field,val){
  state.formDraft[field] = val;
  if(field!=="override") state.formDraft.override = false;
  state.formDraft.error = "";
  // birthdays are always single-day — keep end in sync with start
  if(state.formDraft.type==="birthday" && (field==="type" || field==="start")){
    state.formDraft.end = state.formDraft.start;
  }
  rerender();
}
function submitForm(){
  const d = state.formDraft;
  if(!d.start || !d.end){ d.error="Укажите даты начала и окончания."; rerender(); return; }
  if(d.end < d.start){ d.error="Дата окончания раньше даты начала."; rerender(); return; }
  if(d.type==="vacation"){
    const conflicts = findConflicts({events:state.events,employees:state.employees,employeeName:d.employee,start:d.start,end:d.end,excludeId:state.editingId});
    if(conflicts.length>0 && !d.override){ d.error="Есть пересечение по датам с взаимозаменяемым сотрудником — измените даты или подтвердите ниже."; rerender(); return; }
  }
  if(d.employee) ensureEmployee(d.employee.trim());
  const payload = {type:d.type, title:d.title.trim(), employee:d.employee.trim(), start:d.start, end:d.end, note:d.note.trim()};
  if(state.editingId){
    state.events = state.events.map(e=> e.id===state.editingId ? {...e, ...payload} : e);
  } else {
    state.events.push({...payload, id:uid()});
  }
  persist();
  closeForm();
}
function removeEvent(id){
  state.events = state.events.filter(e=>e.id!==id);
  persist();
  rerender();
}

function openPeople(){ state.peopleOpen=true; rerender(); }
function closePeople(){ state.peopleOpen=false; rerender(); }
function addPerson(){
  const nameEl = document.getElementById("new-emp-name");
  const name = nameEl.value.trim();
  if(!name || findEmployee(state.employees,name)) return;
  state.employees.push({id:uid(), name, group:"", reportsTo:""});
  persist();
  rerender();
}
function updatePersonField(id, field, value){
  state.employees = state.employees.map(e=> e.id===id ? {...e, [field]: value} : e);
  persist();
  rerender();
}
function removePerson(id){
  state.employees = state.employees.filter(e=>e.id!==id);
  persist();
  rerender();
}

/* ================= Init ================= */
load();
applyFilterFromURL();
render();
checkAndFireNotifications();
setInterval(checkAndFireNotifications, 60*60*1000);
</script>
